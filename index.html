<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои Дни Рождения 🎂</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;padding:24px 16px;display:flex;align-items:center;justify-content:center;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#2b2b3a;background:linear-gradient(160deg,#ffe9f0 0%,#eef1ff 55%,#f6e9ff 100%);background-attachment:fixed;}
  .screen{width:100%;max-width:560px}
  .panel{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:26px 22px;box-shadow:0 18px 50px rgba(120,80,160,.16);}
  h1{margin:0 0 6px;font-size:23px;text-align:center}
  .sub{margin:0 0 20px;font-size:14px;color:#817c99;line-height:1.45;text-align:center}
  .label{font-size:13px;font-weight:600;color:#7a7690;margin:0 0 6px}
  .field{margin-bottom:14px}
  input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #e6e2f0;background:#fff;font:inherit;color:inherit;outline:none;transition:.15s;}
  input:focus{border-color:#ffb3cd;box-shadow:0 0 0 3px rgba(255,77,136,.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:16px;border:0;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s;text-decoration:none;}
  .btn:active{transform:scale(.97)}
  .btn.primary{width:100%;background:linear-gradient(135deg,#8b5cf6,#ff5c8a);color:#fff;box-shadow:0 12px 28px rgba(139,92,246,.28)}
  .btn.small{padding:10px 16px;border-radius:12px;font-size:13px}
  .tg-settings{background:#f7f4fd;border:1px solid #ece8f6;padding:14px;border-radius:16px;margin-bottom:20px;}
  .tg-settings .label{color:#d62a63;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .tg-settings .hint{font-size:12px;color:#817c99;margin-top:-6px;margin-bottom:12px;display:block;}
  .tg-settings .hint a{color:#8b5cf6;text-decoration:none;}
  .bday-row{display:flex;gap:8px;margin-bottom:10px;}
  .bday-row input{flex:1;}
  .bday-row input[type="date"]{flex:0 0 140px;}
  .list-item{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 14px;border-radius:12px;margin-bottom:8px;border:1px solid #f0ecf9;font-size:15px;}
  .del-btn{background:none;border:none;color:#ff5c8a;font-size:18px;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>

<div class="screen">
  <div class="panel">
    <h1>🎂 Мои Дни Рождения</h1>
    <p class="sub">Введи даты, и бот напомнит тебе в Телеграме, когда наступит праздник.</p>

    <div class="tg-settings">
      <div class="label">🤖 Настройки Telegram</div>
      <div class="hint">Создай бота у <a href="https://t.me/BotFather" target="_blank">@BotFather</a>, а свой ID узнай у <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a>.</div>
      <div class="field"><input id="tgToken" placeholder="Токен бота (например: 7123456789:AAH...)"></div>
      <div class="field" style="margin-bottom:0"><input id="tgChatId" placeholder="Твой Chat ID (например: 123456789)"></div>
    </div>

    <div class="label">Добавить человека</div>
    <div class="bday-row">
      <input type="date" id="bdayDate">
      <input type="text" id="bdayName" placeholder="Имя (Мама, Аня...)">
      <button class="btn primary small" id="addBtn" style="flex: 0 0 auto; width: 50px; padding: 0;">+</button>
    </div>

    <div id="bdayList" style="margin-top: 20px; margin-bottom: 20px;"></div>

    <button class="btn primary" id="saveBtn">Сохранить в облако</button>
    <div id="status" style="text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; color: #d62a63; min-height: 20px;"></div>
  </div>
</div>

<script>
  // ТУТ УЖЕ ВСТАВЛЕНА ТВОЯ ССЫЛКА НА ВОРКЕР!
  const API_URL = 'https://birthday-bot.dima-kuzmenko543.workers.dev';

  let birthdays = JSON.parse(localStorage.getItem('my_bdays') || '[]');

  function render() {
    const list = document.getElementById('bdayList');
    if (birthdays.length === 0) {
      list.innerHTML = '<div style="text-align:center; font-size:13px; color:#aaa;">Список пока пуст</div>';
      return;
    }
    birthdays.sort((a,b) => a.date.substring(5).localeCompare(b.date.substring(5)));
    list.innerHTML = birthdays.map((b, i) => {
      const d = b.date.split('-');
      const formatted = `${d[2]}.${d[1]}`;
      return `<div class="list-item"><span>${b.name} <span style="color:#817c99; font-size:13px;">(${formatted})</span></span><button class="del-btn" onclick="removeBday(${i})">×</button></div>`;
    }).join('');
  }

  window.removeBday = function(index) {
    birthdays.splice(index, 1);
    localStorage.setItem('my_bdays', JSON.stringify(birthdays));
    render();
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    const dateInput = document.getElementById('bdayDate').value;
    const nameInput = document.getElementById('bdayName').value.trim();
    if (!dateInput || !nameInput) { alert('Введи имя и выбери дату!'); return; }
    const parts = dateInput.split('-');
    const dateStr = `${parts[2]}-${parts[1]}`; // DD-MM
    birthdays.push({ name: nameInput, date: dateStr });
    localStorage.setItem('my_bdays', JSON.stringify(birthdays));
    document.getElementById('bdayName').value = '';
    render();
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const token = document.getElementById('tgToken').value.trim();
    const chatId = document.getElementById('tgChatId').value.trim();
    const status = document.getElementById('status');
    localStorage.setItem('my_tg_token', token);
    localStorage.setItem('my_tg_id', chatId);

    if (!token || !chatId) { status.style.color = 'red'; status.textContent = 'Ошибка: Заполни Токен и Chat ID!'; return; }
    if (birthdays.length === 0) { status.style.color = 'red'; status.textContent = 'Ошибка: Добавь хотя бы один день рождения!'; return; }

    status.style.color = '#8b5cf6';
    status.textContent = 'Отправляем в облако...';

    try {
      const res = await fetch(`${API_URL}/save`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, chatId: chatId, birthdays: birthdays })
      });
      const data = await res.json();
      if (data.ok) {
        status.style.color = 'green';
        status.textContent = '✅ Успешно сохранено! Бот пришлет напоминание.';
      } else { throw new Error(); }
    } catch (e) {
      status.style.color = 'red';
      status.textContent = '❌ Ошибка сохранения. Проверь ссылку на Worker.';
    }
  });

  if (localStorage.getItem('my_tg_token')) document.getElementById('tgToken').value = localStorage.getItem('my_tg_token');
  if (localStorage.getItem('my_tg_id')) document.getElementById('tgChatId').value = localStorage.getItem('my_tg_id');
  document.getElementById('bdayDate').valueAsDate = new Date();
  render();
</script>
</body>
</html>
